version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roomly_postgres
    environment:
      POSTGRES_USER: roomly
      POSTGRES_PASSWORD: roomly
      POSTGRES_DB: roomly_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roomly_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: roomly_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@roomly.in
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
