name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.1.0"

jobs:
  # ── Job 1: Lint + Typecheck ──────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (turbo)
        run: pnpm turbo lint

      - name: Typecheck (turbo)
        run: pnpm turbo typecheck

  # ── Job 2: Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roomly_test
          POSTGRES_PASSWORD: roomly_test
          POSTGRES_DB: roomly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://roomly_test:roomly_test@localhost:5432/roomly_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      REFRESH_TOKEN_SECRET: ci_test_refresh_secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: packages/database
        run: npx prisma migrate deploy

      - name: Run tests (turbo)
        run: pnpm turbo test

  # ── Job 3: Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      # Stub vars needed for Next.js build — not real credentials
      NEXT_PUBLIC_APP_URL: https://roomly.in
      NEXT_PUBLIC_ALGOLIA_APP_ID: stub
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: stub
      NEXT_PUBLIC_MAPBOX_TOKEN: stub
      DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      JWT_SECRET: stub_build_secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm turbo build

      - name: Confirm zero build errors
        run: echo "Build completed successfully"
